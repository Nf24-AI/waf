<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf0f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1322" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="واف — أدوات مدير المشروع ومالك المنتج: جهّز اجتماعك، واحفظ قراراته، ورتّب وقتك." />
    <meta property="og:title" content="واف" />
    <meta property="og:description" content="من وَفَى: أتمَّ وأكمل. أدوات مدير المشروع ومالك المنتج." />
    <meta property="og:image" content="/og.jpg" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>واف</title>
    <script>
      // المظهر واللغة قبل أول رسم حتى لا تومض الصفحة
      try {
        var th = localStorage.getItem("waf:theme");
        if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
        if (localStorage.getItem("waf:lang") === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
